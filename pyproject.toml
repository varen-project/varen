[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "med-algo"
version = "0.1.0"
description = "Medium-voltage wire detection from LiDAR point clouds"
authors = [
    {name = "Mohamed Gaha", email = "gaha.mohamed@hydroquebec.com"}
]
license = {text = "MPL-2.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<4.0",
    "laspy[laszip]>=2.0,<3.0",
    "scipy>=1.10,<2.0",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.2,<2.0",
    "pyproj>=3.6,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
]

[project.scripts]
med-algo = "med_algo.pipeline:_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v"
